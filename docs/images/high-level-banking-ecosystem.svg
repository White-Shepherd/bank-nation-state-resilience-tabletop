<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Shared control planes connect critical banking services</title><desc id="desc">Four groups of critical services rely on five highlighted shared dependencies. Enterprise identity has the highest declared critical relationship count. All data is synthetic.</desc><rect width="1600" height="900" fill="#F8FAFB"/><rect x="0" y="0" width="1600" height="12" fill="#16867A"/><text x="90" y="92" font-family="Arial" font-size="43" font-weight="700" fill="#11243A">Critical banking services rely on shared control planes</text><text x="90" y="137" font-family="Arial" font-size="23" fill="#5C6B7A">Concentrated authority can create common-mode failure across otherwise separate services.</text><text x="90" y="187" font-family="Arial" font-size="15" font-weight="700" letter-spacing="1.2" fill="#2B6F9E">CRITICAL BANKING SERVICES</text><rect x="90" y="215" width="330" height="220" rx="16" fill="#FFFFFF" stroke="#C8D5DD" stroke-width="2"/><text x="114" y="251" font-family="Arial" font-size="15" font-weight="700" letter-spacing=".8" fill="#2B6F9E">CUSTOMER ACCESS</text><text x="114" y="287" font-family="Arial" font-size="17" fill="#11243A">Customer authentication</text><text x="114" y="313" font-family="Arial" font-size="17" fill="#11243A">Account inquiry</text><text x="114" y="339" font-family="Arial" font-size="17" fill="#11243A">Customer communications</text><rect x="452" y="215" width="330" height="220" rx="16" fill="#FFFFFF" stroke="#C8D5DD" stroke-width="2"/><text x="476" y="251" font-family="Arial" font-size="15" font-weight="700" letter-spacing=".8" fill="#2B6F9E">MONEY MOVEMENT</text><text x="476" y="287" font-family="Arial" font-size="17" fill="#11243A">ACH</text><text x="476" y="313" font-family="Arial" font-size="17" fill="#11243A">Wire transfers</text><text x="476" y="339" font-family="Arial" font-size="17" fill="#11243A">Card authorization</text><text x="476" y="365" font-family="Arial" font-size="17" fill="#11243A">Card clearing and settlement</text><text x="476" y="391" font-family="Arial" font-size="17" fill="#11243A">ATM withdrawals</text><text x="476" y="417" font-family="Arial" font-size="17" fill="#11243A">Treasury-management services</text><rect x="814" y="215" width="330" height="220" rx="16" fill="#FFFFFF" stroke="#C8D5DD" stroke-width="2"/><text x="838" y="251" font-family="Arial" font-size="15" font-weight="700" letter-spacing=".8" fill="#2B6F9E">CONTROL &amp; RECORD</text><text x="838" y="287" font-family="Arial" font-size="17" fill="#11243A">Core deposit processing</text><text x="838" y="313" font-family="Arial" font-size="17" fill="#11243A">Fraud monitoring</text><text x="838" y="339" font-family="Arial" font-size="17" fill="#11243A">Liquidity reporting</text><text x="838" y="365" font-family="Arial" font-size="17" fill="#11243A">General ledger</text><text x="838" y="391" font-family="Arial" font-size="17" fill="#11243A">Regulatory reporting</text><rect x="1176" y="215" width="330" height="220" rx="16" fill="#FFFFFF" stroke="#C8D5DD" stroke-width="2"/><text x="1200" y="251" font-family="Arial" font-size="15" font-weight="700" letter-spacing=".8" fill="#2B6F9E">CRISIS &amp; RECOVERY</text><text x="1200" y="287" font-family="Arial" font-size="17" fill="#11243A">Incident coordination</text><text x="1200" y="313" font-family="Arial" font-size="17" fill="#11243A">Technology recovery</text><path d="M255 435 V500 H1345 V435 M617 435 V500 M979 435 V500" fill="none" stroke="#6F8798" stroke-width="3"/><path d="M800 500 V555" fill="none" stroke="#6F8798" stroke-width="3" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6F8798"/></marker></defs><text x="90" y="585" font-family="Arial" font-size="15" font-weight="700" letter-spacing="1.2" fill="#2B6F9E">SHARED TIER 0 AND RECOVERY DEPENDENCIES</text><rect x="90" y="615" width="258" height="135" rx="14" fill="#FFFFFF" stroke="#A63D40" stroke-width="4"/><text x="110" y="654" font-family="Arial" font-size="18" font-weight="700" fill="#11243A">Enterprise identity provider</text><text x="110" y="693" font-family="Arial" font-size="34" font-weight="700" fill="#A63D40">7</text><text x="152" y="692" font-family="Arial" font-size="15" fill="#5C6B7A">critical relationships</text><text x="110" y="724" font-family="Arial" font-size="14" fill="#5C6B7A">Declared in the synthetic model</text><rect x="372" y="615" width="258" height="135" rx="14" fill="#FFFFFF" stroke="#C98324" stroke-width="2"/><text x="392" y="654" font-family="Arial" font-size="18" font-weight="700" fill="#11243A">Backup platform</text><text x="392" y="693" font-family="Arial" font-size="34" font-weight="700" fill="#C98324">4</text><text x="434" y="692" font-family="Arial" font-size="15" fill="#5C6B7A">critical relationships</text><text x="392" y="724" font-family="Arial" font-size="14" fill="#5C6B7A">Declared in the synthetic model</text><rect x="654" y="615" width="258" height="135" rx="14" fill="#FFFFFF" stroke="#C98324" stroke-width="2"/><text x="674" y="654" font-family="Arial" font-size="18" font-weight="700" fill="#11243A">Clean-room recovery</text><text x="674" y="693" font-family="Arial" font-size="34" font-weight="700" fill="#C98324">2</text><text x="716" y="692" font-family="Arial" font-size="15" fill="#5C6B7A">critical relationships</text><text x="674" y="724" font-family="Arial" font-size="14" fill="#5C6B7A">Declared in the synthetic model</text><rect x="936" y="615" width="258" height="135" rx="14" fill="#FFFFFF" stroke="#C98324" stroke-width="2"/><text x="956" y="654" font-family="Arial" font-size="18" font-weight="700" fill="#11243A">Database-management plane</text><text x="956" y="693" font-family="Arial" font-size="34" font-weight="700" fill="#C98324">2</text><text x="998" y="692" font-family="Arial" font-size="15" fill="#5C6B7A">critical relationships</text><text x="956" y="724" font-family="Arial" font-size="14" fill="#5C6B7A">Declared in the synthetic model</text><rect x="1218" y="615" width="258" height="135" rx="14" fill="#FFFFFF" stroke="#C98324" stroke-width="2"/><text x="1238" y="654" font-family="Arial" font-size="18" font-weight="700" fill="#11243A">Payment approval</text><text x="1238" y="693" font-family="Arial" font-size="34" font-weight="700" fill="#C98324">2</text><text x="1280" y="692" font-family="Arial" font-size="15" fill="#5C6B7A">critical relationships</text><text x="1238" y="724" font-family="Arial" font-size="14" fill="#5C6B7A">Declared in the synthetic model</text><rect x="90" y="800" width="1420" height="48" rx="8" fill="#11243A"/><text x="116" y="831" font-family="Arial" font-size="18" font-weight="700" fill="#FFFFFF">BOARD IMPLICATION</text><text x="330" y="831" font-family="Arial" font-size="18" fill="#FFFFFF">Protect shared authority, validate integrity independently, and recover without production control planes.</text><text x="1510" y="879" text-anchor="end" font-family="Arial" font-size="13" fill="#5C6B7A">SYNTHETIC EXERCISE DATA - NOT A REAL BANK</text></svg>