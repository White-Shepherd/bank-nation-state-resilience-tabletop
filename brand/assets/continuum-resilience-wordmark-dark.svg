<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">Continuum Resilience wordmark for dark backgrounds</title>
  <desc id="desc">Continuum in white with Resilience in signal teal on a dark navy background.</desc>
  <rect width="760" height="180" fill="#102A43"/>
  <rect x="48" y="42" width="8" height="96" fill="#118C82"/>
  <text x="84" y="91" font-family="Aptos,Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="2" fill="#FFFFFF">CONTINUUM</text>
  <text x="86" y="132" font-family="Aptos,Arial,sans-serif" font-size="27" font-weight="600" letter-spacing="7" fill="#118C82">RESILIENCE</text>
</svg>
