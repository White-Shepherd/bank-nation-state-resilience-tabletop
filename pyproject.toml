[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "harbor-ridge-resilience"
version = "1.0.0"
description = "Synthetic nation-state banking resilience tabletop"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.36", "pydantic>=2.7", "PyYAML>=6.0", "reportlab>=4.2", "plotly>=6.9,<7", "kaleido>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
