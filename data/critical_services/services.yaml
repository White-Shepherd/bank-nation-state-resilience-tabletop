# SYNTHETIC EXERCISE DATA - NOT A REAL BANK
- &base
  id: CBS-01
  name: Customer authentication
  owner: Digital Banking
  dependencies: [enterprise-identity, authoritative-dns, certificate-keys, carrier-diversity, security-monitoring]
  tolerance: &tol
    mtd_minutes: 120
    rto_minutes: 60
    rpo_minutes: 5
    minimum_service_pct: 60
    max_data_uncertainty_minutes: 5
    max_backlog: 10000
    customer_harm_threshold: 10000 customers unable to authenticate
    financial_loss_threshold_usd: 500000
    liquidity_consequence: Deposit movement visibility degrades
    regulatory_consequence: Customer harm and operational incident review
    manual_workaround_minutes: 30
- <<: *base
  id: CBS-02
  name: Account balance and transaction inquiry
  owner: Deposit Operations
  dependencies: [core-banking, enterprise-identity, authoritative-dns, reconciliation-data]
  tolerance: {<<: *tol, mtd_minutes: 240, rto_minutes: 90, max_data_uncertainty_minutes: 15}
- <<: *base
